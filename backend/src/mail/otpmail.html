<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{APP_NAME}} OTP</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f4f7fb;
        font-family: Arial, Helvetica, sans-serif;
        color: #1f2937;
      }

      .email-wrapper {
        width: 100%;
        background-color: #f4f7fb;
        padding: 40px 20px;
      }

      .email-container {
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }

      .header {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        padding: 28px 24px;
        text-align: center;
      }

      .logo {
        font-size: 28px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 1px;
      }

      .content {
        padding: 32px 28px 24px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 28px;
        color: #111827;
      }

      p {
        margin: 0 0 18px;
        line-height: 1.7;
        font-size: 16px;
        color: #374151;
      }

      .otp-box {
        margin: 28px auto;
        text-align: center;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        border-radius: 12px;
        padding: 22px 16px;
      }

      .otp-code {
        font-size: 36px;
        font-weight: 700;
        letter-spacing: 10px;
        color: #1d4ed8;
      }

      .note {
        font-size: 14px;
        color: #6b7280;
      }

      .footer {
        background: #f8fafc;
        padding: 20px 24px 28px;
        text-align: center;
        font-size: 13px;
        color: #6b7280;
      }

      @media screen and (max-width: 480px) {
        .content {
          padding: 24px 18px 20px;
        }

        .otp-code {
          font-size: 28px;
          letter-spacing: 6px;
        }
      }
    </style>
  </head>
  <body>
    <div class="email-wrapper">
      <div class="email-container">
        <div class="header">
          <div class="logo">{{APP_NAME}}</div>
        </div>

        <div class="content">
          <h1>Your OTP Code</h1>
          <p>Hello {{USER_NAME}},</p>
          <p>
            Use the code below to verify your identity and complete your request.
          </p>

          <div class="otp-box">
            <div class="otp-code">{{OTP}}</div>
          </div>

          <p class="note">
            This code expires in 10 minutes. Do not share it with anyone.
          </p>

          <p>
            If you did not request this, please ignore this email.
          </p>
        </div>

        <div class="footer">
          © 2026 {{APP_NAME}} • Secure account verification
        </div>
      </div>
    </div>
  </body>
</html>
